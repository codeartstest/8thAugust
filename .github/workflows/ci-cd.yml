name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - dev

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify static website files
        run: |
          for file in index.html styles.css script.js; do
            if [ ! -f "$file" ]; then
              echo "ERROR: $file not found"
              exit 1
            fi
            echo "OK: $file found"
          done

      - name: Validate HTML structure
        run: |
          if ! grep -q '<!DOCTYPE html>' index.html; then
            echo "ERROR: Missing DOCTYPE declaration"
            exit 1
          fi
          if ! grep -q '</html>' index.html; then
            echo "ERROR: Missing closing html tag"
            exit 1
          fi
          echo "HTML structure validated"